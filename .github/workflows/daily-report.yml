name: Daily Intelligence Report

on:
  push:
    branches: [main]
  schedule:
    # Two attempts per hour at :18 and :48. A small cron change re-registers
    # the schedule if GitHub stops emitting scheduled events while manual runs work.
    - cron: "18,48 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run report acceptance tests
        run: python -m unittest discover -s tests -v

      - name: Generate daily report
        run: python main.py --live --restore-published-state

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
